clients:
  - cidr: 172.30.0.10/32
    allow:
      - dest: [10.10.0.20/32]
        proto: tcp
        ports: [8080, 9000-9001]
      - dest: [10.10.0.20/32]
        proto: udp
        ports: [5353]
      - dest: [10.10.0.20/32]
        proto: icmp
      # A service on the gateway host itself, reached through the input hook.
      - dest: [172.30.0.2/32]
        proto: tcp
        ports: [2222]
      # Host rules: http by host and path, https by SNI (the proxy on :3128 checks them).
      - dest: [10.10.0.20/32]
        proto: http
        hosts: [app.example.com/public]
      - dest: [10.10.0.20/32]
        proto: https
        hosts: [secure.example.com]
      # An IP rule for the same backend and port: the https host rule still takes precedence.
      - dest: [10.10.0.20/32]
        proto: tcp
        ports: [443]

  # The same client over IPv6, with a narrower allow list.
  - cidr: fd00:30::10/128
    allow:
      - dest: ["fd00:10::20/128"]
        proto: tcp
        ports: [8080]
      - dest: ["fd00:10::20/128"]
        proto: icmp
      - dest: ["fd00:10::20/128"]
        proto: http
        hosts: [app.example.com/public]

  # Every external client may reach the OIDC provider, so it can log in to the portal.
  - cidr: 172.30.0.0/24
    allow:
      - dest: [10.10.0.30/32]
        proto: tcp
        ports: [5556]

# Users logging in through the portal (the username is Dex's verified email claim).
# bob@example.com exists in Dex but has no entry, so his login is refused.
users:
  - username: alice@example.com
    allow:
      - dest: [10.10.0.20/32, "fd00:10::20/128"]
        proto: tcp
        ports: [8081, 8082]   # 8082 is a TCP echo service for long-lived flows
      # An endless HTTP stream, through the proxy while alice's session lasts.
      - dest: [10.10.0.20/32]
        proto: http
        ports: [8083]
        hosts: [stream.example.com]
