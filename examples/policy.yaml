# Drawbridge allow-list policy.
#
# Each client (a source CIDR arriving on the external interface) lists the
# destinations it may reach. Anything not listed is dropped.
#
#   dest:  destination CIDRs (same address family as the client)
#   proto: tcp | udp | icmp | any
#   ports: optional, tcp/udp only; single ports or "lo-hi" ranges
clients:
  - cidr: 192.168.50.0/24
    allow:
      - dest: [10.0.1.0/24]
        proto: tcp
        ports: [443, 8000-8100]
      - dest: [10.0.0.53/32]
        proto: udp
        ports: [53]

  - cidr: fd00:50::/64
    allow:
      - dest: ["fd00:1::/64"]
        proto: icmp

# Users authenticate through the portal; their allow list is applied to the
# source IP they log in from, for as long as their session lasts. A user's
# dests may mix address families: only those matching the login IP apply.
users:
  - username: alice
    allow:
      - dest: [10.0.1.0/24, "fd00:1::/64"]
        proto: tcp
        ports: [22, 443]
