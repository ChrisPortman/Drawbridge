# Drawbridge allow-list policy.
#
# Each client (a source CIDR arriving on the external interface) lists the
# destinations it may reach. Anything not listed is dropped.
#
#   dest:  destination CIDRs (same address family as the client)
#   proto: tcp | udp | icmp | any | http | https
#   ports: optional, tcp/udp/http/https only; single ports or "lo-hi" ranges
#          (http and https default to 80 and 443)
#   hosts: http/https only; the hostnames (exact or "*.") allowed at dest,
#          and for http an optional path prefix (example.com/docs)
clients:
  - cidr: 192.168.50.0/24
    allow:
      - dest: [10.0.1.0/24]
        proto: tcp
        ports: [443, 8000-8100]
      - dest: [10.0.0.53/32]
        proto: udp
        ports: [53]
      - dest: [10.0.2.0/24]
        proto: https
        hosts: [git.example.com, "*.docs.example.com"]

  - cidr: fd00:50::/64
    allow:
      - dest: ["fd00:1::/64"]
        proto: icmp

# Users authenticate through the portal; their allow list is applied to the
# source IP they log in from, for as long as their session lasts. A user's
# dests may mix address families: only those matching the login IP apply.
users:
  - username: alice
    allow:
      - dest: [10.0.1.0/24, "fd00:1::/64"]
        proto: tcp
        ports: [22, 443]
      - dest: [10.0.3.10/32]
        proto: http
        hosts: [wiki.example.com/team]
