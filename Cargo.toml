[package]
name = "drawbridge"
version = "0.1.0"
edition = "2024"
# File::try_lock (instance lock) is stable from 1.89.
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = "0.18"
ipnetwork = { version = "0.21.1", features = ["serde"] }
libc = "0.2.190"
nix = { version = "0.31.3", features = ["socket", "net", "uio"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10.3"
rustables = "0.9"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
